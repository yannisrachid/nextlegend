version: "3.9"

services:
  caddy:
    image: caddy:2
    container_name: nextlegend_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api

  postgres:
    image: postgres:15-alpine
    container_name: nextlegend_postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nextlegend_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - ./helpers/csv:/helpers/csv:ro
      - ./config:/config:ro
    expose:
      - "8000"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: nextlegend_frontend
    restart: unless-stopped
    env_file: .env
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    expose:
      - "3000"

  pipeline-refresh:
    build:
      context: ./jobs/pipeline
      dockerfile: Dockerfile
    container_name: nextlegend_pipeline
    env_file: .env
    environment:
      PIPELINE_INPUT_URI: s3://${S3_BUCKET}/data/wyscout_players_final.csv
      PIPELINE_INPUT_KIND: raw
      S3_PREFIX: new_nextlegend
      ARCHIVE_RETAIN_RUNS: 8
    depends_on:
      postgres:
        condition: service_started
    volumes:
      - ./jobs/pipeline:/app
      - ./helpers/csv:/helpers/csv:ro
      - ./apps/api/helpers/player_profiles.json:/profiles/player_profiles.json:ro
    entrypoint: ["python", "-m", "pipeline.run"]
    profiles: ["pipeline"]

volumes:
  db_data:
  caddy_data:
  caddy_config:
