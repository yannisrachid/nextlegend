version: "3.9"

services:
  caddy:
    image: caddy:2
    container_name: nextlegend_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../apps/api
      dockerfile: ../../apps/api/Dockerfile
    env_file:
      - ../../.env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ../../helpers/csv:/helpers/csv:ro
      - ../../config:/config:ro

  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: ../../apps/frontend/Dockerfile
    env_file:
      - ../../.env
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started

  pipeline:
    profiles: ["jobs"]
    build:
      context: ../../jobs/pipeline
      dockerfile: ../../jobs/pipeline/Dockerfile
    env_file:
      - ../../.env
    environment:
      PROFILES_PATH: /profiles/player_profiles.json
      MERCATO_LEAGUE_LEVELS_PATH: /config/mercato_league_levels.json
    depends_on:
      db:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ../../jobs/pipeline:/app
      - ../../data:/data
      - ../../apps/api/helpers/player_profiles.json:/profiles/player_profiles.json:ro
      - ../../apps/api/helpers/mercato_league_levels.json:/config/mercato_league_levels.json:ro
      - ../../helpers/csv:/helpers/csv:ro
    entrypoint: ["python", "-m", "pipeline.run"]

  pipeline-refresh:
    profiles: ["jobs"]
    build:
      context: ../../jobs/pipeline
      dockerfile: ../../jobs/pipeline/Dockerfile
    env_file:
      - ../../.env
    environment:
      PIPELINE_INPUT_URI: s3://${S3_BUCKET}/data/wyscout_players_final.csv
      PIPELINE_INPUT_KIND: raw
      PIPELINE_REPLACE_TABLES: 1
      S3_PREFIX: new_nextlegend
      ARCHIVE_RETAIN_RUNS: 8
      MERCATO_LEAGUE_LEVELS_PATH: /config/mercato_league_levels.json
    depends_on:
      db:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ../../jobs/pipeline:/app
      - ../../data:/data
      - ../../apps/api/helpers/player_profiles.json:/profiles/player_profiles.json:ro
      - ../../apps/api/helpers/mercato_league_levels.json:/config/mercato_league_levels.json:ro
      - ../../helpers/csv:/helpers/csv:ro
    entrypoint: ["python", "-m", "pipeline.run"]

  current-season-job:
    profiles: ["jobs"]
    build:
      context: ../../
      dockerfile: wyscout_current_season_job/Dockerfile
    env_file:
      - ../../.env
      - ../../wyscout_current_season_job/.env
    environment:
      PROFILES_PATH: /profiles/player_profiles.json
      MERCATO_LEAGUE_LEVELS_PATH: /config/mercato_league_levels.json
      PIPELINE_RUNNER: python
      PIPELINE_INPUT_URI: /workspace/data/wyscout_players_final.csv
      PIPELINE_INPUT_KIND: raw
      TARGET_FINAL_CSV: /workspace/data/wyscout_players_final.csv
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ../../:/workspace
      - ../../apps/api/helpers/player_profiles.json:/profiles/player_profiles.json:ro
      - ../../apps/api/helpers/mercato_league_levels.json:/config/mercato_league_levels.json:ro
      - ../../helpers/csv:/helpers/csv:ro

volumes:
  db_data:
  minio_data:
  caddy_data:
  caddy_config:
